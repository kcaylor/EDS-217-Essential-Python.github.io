# EDS 217 2026: pre-launch punch list
#
# This file is the source of truth for what remains before the course goes live.
# It is read and written by tools/prelaunch.py. Edit it by hand if you want, but
# prefer the CLI for state changes so that certification records stay consistent.
#
#   python tools/prelaunch.py status          overview table
#   python tools/prelaunch.py next            the next item that is not blocked
#   python tools/prelaunch.py show D5         full detail for one item
#   python tools/prelaunch.py check D5        run the verification, record evidence
#   python tools/prelaunch.py certify D5      record Kelly's sign-off
#   python tools/prelaunch.py dashboard       rebuild the HTML dashboard
#
# States: open -> in_progress -> verified -> certified. Also: blocked, deferred.
# An item reaches "verified" only when its verification command passes.
# An item reaches "certified" only when Kelly signs off on a verified item.

meta:
  course: EDS 217, Python for Environmental Data Science
  term: Summer 2026
  first_class_day: 2026-08-31
  repo: EDS-217-Essential-Python.github.io
  branch: main
  live_site: https://eds-217-essential-python.github.io/
  remotes:
    origin: https://github.com/kcaylor/EDS-217-Essential-Python.github.io
    live: https://github.com/EDS-217-Essential-Python/EDS-217-Essential-Python.github.io
  audited: 2026-08-21
  schema: 1

items:

