- id: D1
  title: Stop an incremental build from destroying the rendered site
  category: deploy
  severity: blocker
  owner: claude
  state: open
  why: |
    build_docs.py calls clean_docs() on every code path, including the
    incremental one. clean_docs() runs shutil.rmtree("docs"). An incremental
    build therefore deletes the whole rendered site and then re-renders only the
    files git reports as changed. This already happened on 2026-08-16 and is the
    direct cause of the 391 deleted files sitting in the working tree today.
  evidence: |
    build_docs.py line 447 calls clean_docs() unconditionally; line 189 is
    shutil.rmtree(docs_path). Working tree: 391 deletions under docs/, two
    surviving HTML files, both re-rendered at 2026-08-16 00:31.
  action: |
    Move the clean_docs() call inside the --full branch so an incremental build
    leaves docs/ alone. Add a guard that refuses to proceed if a non-full build
    would leave fewer than 50 HTML files in docs/.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py d1_clean_docs_guard
    expect: exit 0
  blocks: [D5]

- id: D2
  title: Correct the full-render file set
  category: deploy
  severity: blocker
  owner: claude
  state: open
  why: |
    get_all_buildable_files() globs every qmd and ipynb in the tree and skips
    only paths containing "nbs/" or "extra_files/". It therefore renders 166
    files where the correct set is 101. The 65 extras are the 59 retired 2025
    pages under the gitignored _to_delete/2025-orphan-sweep/, two under
    _to_delete/positron-switch/, the three pages _quarto.yml explicitly excludes,
    and an .ipynb_checkpoints copy. Rendering retired 2025 pages puts them back
    on the live site, which is exactly what the orphan sweep removed.
  evidence: |
    build_docs.py --full enumerates 166 files. The endgame plan and the
    _quarto.yml render block agree the correct count is 101.
  action: |
    Teach get_all_buildable_files() to honour the _quarto.yml render exclusions
    and to skip _to_delete/ and .ipynb_checkpoints/.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py d2_render_set
    expect: the buildable set is 101 files
  blocks: [D5]

