# Things no script can check, recorded by hand.
#
# A check that passes on the mechanical half of an item and stays silent about
# the rest reports the work as done when it is not. C10 did that for six days,
# passing on em-dashes while eighty-seven pages went unread. C3 was doing the
# same: it verified that the TA photo exists and said nothing about the syllabus
# link or the office hours.
#
# Set a date, in YYYY-MM-DD, once you have actually confirmed the thing. Leave a
# note saying what you found or decided. Until then the check fails, which is
# the correct answer.

syllabus_2026_shared:
  confirmed: null
  note: |
    Open the navbar syllabus link the way a student would, signed out or in a
    private window. Confirm it is the 2026 version and that it is readable
    without asking for access.

office_hours:
  confirmed: null
  note: |
    Decide whether office hours go on the site, and where. Recording "no office
