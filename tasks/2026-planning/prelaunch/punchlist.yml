- id: H5
  title: Clear the stale git locks and the _to_delete directory on the laptop
  category: housekeeping
  severity: low
  owner: kelly
  state: open
  why: |
    The Cowork mount cannot delete files, so every git write from a session
    leaves a lock file behind and every retired file has been moved into
    _to_delete/ rather than removed. .git/index.lock is present right now and
    will make the next git write fail. _to_delete/git-stale-locks/ holds fifteen
    HEAD.lock files and six index.lock files.
  evidence: |
    .git/index.lock dated 2026-08-21 04:09 exists. _to_delete/ holds
    2025-orphan-sweep/, positron-switch/ and git-stale-locks/.
  action: |
    Run `make unlock`, which checks that no git process is actually running and
    then removes the lock files. It is also the first thing `make publish` does,
    so the publish path can no longer be stopped by one.

    Separately, `rm -rf _to_delete` on the laptop once you are satisfied nothing
    in it is wanted. It is gitignored, so nothing in git changes either way.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py h5_locks_clear
    expect: no lock file present under .git
