- id: C1
  title: Specify Days 8 and 9
  category: content
  severity: blocker
  owner: either
  state: open
  why: |
    Two of nine days, about thirteen contact hours and the only graded
    deliverable, are described in 32 and 33 lines. There is no hour by hour
    schedule, no presentation length or order or format, no submission mechanism
    and no deadline, and no rubric. The single grading reference on the whole
    site is one line in 7d_project_kickoff.qmd saying the notebook is graded
    against the ten-step workflow. answer_keys.qmd points students at
    final_project.qmd for what is expected, and final_project.qmd does not say.
  evidence: |
    wc -l on day8.qmd and day9.qmd returns 32 and 33. A grep across all live
    content for rubric, graded, assessment or "will be evaluated" returns one
    line. A grep for submit, due, deadline or "turn in" returns nothing.
  action: |
    Written 2026-08-23. Decisions taken with Kelly: hand-in is a GitHub
    repository, due when it is pushed at 11:45 on Day 9; assessment is completion
    only, so the notebook carries a checklist of what finished means rather than
    a rubric; presentations are twelve minutes plus three for questions; Day 8
    runs as open work against three stated checkpoints.

    day8.qmd now carries a timed schedule and the three checkpoints, each naming
    which of the ten steps should be done, plus what to cut when a team is behind
    at each one. day9.qmd carries the morning freeze at 11:45, the hand-in steps,
    a twelve-minute walkthrough plan, and the afternoon timing.
    final_project.qmd is rewritten as the definition of the deliverable.

    Two conflicts were resolved rather than left. 8a_github.qmd configures
    nbstripout, which strips the figures that are the point of this notebook, so
    the project goes in its own repository with outputs kept and the pages say
    why. And 7d_project_kickoff.qmd said the notebook was "graded against" the
    ten steps, which no longer holds; it now says built around them.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py c1_day89_specified
    expect: both day pages and the project page carry a schedule, checkpoints, a submission mechanism, a deadline, presentation logistics and a definition of finished

