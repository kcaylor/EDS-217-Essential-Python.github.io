- id: C10
  title: Run a write-as-kelly voice pass over every live page
  category: content
  severity: medium
  owner: either
  state: in_progress
  why: |
    The 2026 pages were written across many sessions and several rebuilds, so the
    voice varies. Some pages read as Kelly wrote them and some read as a machine
    did. Students spend nine days inside this prose.

    The pass is also the only thing that finds comprehension defects. On
    2026-08-23 a cold reader was run over three pages that had just been called
    finished, and found eighteen problems, four of them contradictions introduced
    by the voice pass itself and one that would have made a team throw away their
    dataset on the Thursday night. None of those was a style problem. The
    mechanical checks were all green at the time.
  evidence: |
    89 live pages, tracked page by page in
    tasks/2026-planning/prelaunch/voice-pass.json. Baseline on 2026-08-23: 188
    sentence-initial demonstratives that point back into the text, 43 numerals
    used as nouns, 31 causal uses of "since", zero em-dashes.
  action: |
    **Read these three first.** They are the whole method:

      tasks/2026-planning/prelaunch/house-style.md      the rules Kelly has stated
      tasks/2026-planning/prelaunch/cold-read-prompt.md the editor preflight, verbatim
      tools/voicepass.py --help                          the state machine

    Never edit a page outside the state machine, because sessions drop and the
    ledger is the only memory. One page at a time, committed on its own, so a
    lost connection costs one page at most.

      python tools/voicepass.py resume        says exactly what to do next
      python tools/voicepass.py start <page>  records the SHA and the counts
      <run the write-as-kelly pass, fenced by tools/prose_guard.py>
      python tools/voicepass.py edited <page> refuses if the guard sees a non-prose change
      <cold-read it with a subagent, using the prompt above>
      python tools/voicepass.py record <page> findings.json
      python tools/voicepass.py resolve <page> <n> fixed|needs-kelly|wontfix -n "..."
      python tools/voicepass.py signoff <page> -n "..."

    A page is not signed off while a finding is open. A finding is only
    needs-kelly when the answer is a fact only Kelly holds.

    Five batches, most-read first: the front page, day pages, workflow and project
    spec (12); the end-of-day activities (7); sessions, colabs and live coding
    (35); cheatsheets (24); answer keys (11).

    **A limitation worth recording.** The corpus at ~/dev/kkc_corpus has no
    teaching register. Its folders are email, letters, reviews, grants, evaluative
    and longform, and longform holds one 2003 dissertation abstract. There is no
    verified sample of Kelly writing instructional prose for beginners, so the
    voice half of this pass extrapolates from habits that carry across registers.
    The rules he has stated directly are in house-style.md and are the reliable
    part. Adding two or three verified pre-2022 teaching samples to the corpus
    would improve this a great deal, and is worth doing before 2027.
  verify:
    kind: command
    cmd: bash -c 'python3 tools/prelaunch_checks.py c10_house_style && python3 tools/prose_guard.py verify --all && python3 tools/voicepass.py status'
    expect: zero hard style violations, nothing outside prose changed, and every page in the ledger signed off

# ---------------------------------------------------------------------------
# TOOLING. These decide whether the gates can be trusted.
# ---------------------------------------------------------------------------

- id: T1
  title: Teach warm_cache.py about concatenated data URLs
  category: tooling
  severity: high
  owner: claude
  state: open
  why: |
    warm_cache.py matches literal URL strings. Seven datasets are loaded only as
    base + 'name.csv', so the tool never sees them. It reports "All data URLs
    resolve" while covering 10 of the 17 datasets the course actually loads.
    Delete any of those seven and the gate stays green while Days 5, 6 and 7
    break in class. A checker that reports green on a set it cannot see is worse
    than no checker.
  evidence: |
    The seven are hardiness_zones_2012, hardiness_zones_2023,
    zip_code_database, monthly_co2_concentration, monthly_temperature_data,
    openaq_CNSI_measurments and openaq_santa_barbara_measurments. All exist in
    data/ today.
  action: |
    Resolve simple concatenation against an assigned base variable, and widen
    the ASSIGN pattern so a variable named base is recognised. Report the covered
    dataset count so the coverage claim is visible.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py t1_warm_cache_coverage
    expect: warm_cache reports at least 17 datasets and exits 0

- id: T2
  title: Build a runner for the six quality gates
  category: tooling
  severity: high
  owner: claude
  state: open
  why: |
    The six gates are run by hand from prose in the endgame plan. There is no
    script, no Makefile and no CI anywhere in the repo. Four of the six are
    mechanically checkable and two are not; the runner should say which is which
    rather than implying all six were machine-verified.
  evidence: |
    A grep for "quality gate" across py, sh and yml files returns nothing.
    There is no .github directory.
  action: |
    Add tools/gates.sh running gates 3, 4 (structural half), 5 and 6, reporting
    gates 1 and 2 as human gates with a pointer to where they were recorded.
  verify:
    kind: command
    cmd: bash tools/gates.sh
    expect: exit 0, with gates 1 and 2 reported as human gates

- id: T3
  title: Make fetch_data.py --check fail when a dataset is missing
  category: tooling
  severity: medium
  owner: claude
  state: open
  why: |
    In check mode, a missing upstream dataset goes into a local list that the
    return statement never consults, so --check exits 0 with datasets missing.
  evidence: |
    The check branch appends to "missing" and continues, while the return reads
    "1 if (failed or absent)"; failed is always empty in check mode.
  action: Include the missing list in the exit status.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py t3_fetch_check_exit
    expect: --check returns non-zero when a SOURCES dataset is absent

- id: T4
  title: Make run_cells.py fail when it is given no files
  category: tooling
  severity: medium
  owner: claude
  state: open
  why: |
    With zero arguments the tool prints "0/0 cells ran clean across 0 files" and
    exits 0. A wrapper whose glob matches nothing therefore reports a green gate.
    The docstring's own suggested invocation needs globstar to work in bash.
  evidence: Confirmed by running it with no arguments.
  action: Exit non-zero on an empty file list, with a message naming the problem.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py t4_run_cells_empty
    expect: non-zero exit and a clear message when called with no files

- id: T5
  title: Give penguins.csv a provenance record
  category: tooling
  severity: medium
  owner: claude
  state: open
  why: |
    penguins.csv is loaded by five live pages and appears in neither
    data/data_urls.py nor tools/fetch_data.py. It is the only dataset with no
    provenance record and no coverage in any check, so its loss would be
    invisible until a session failed. messy_field_survey.csv is in fetch_data.py
    but not in data_urls.py, so that module's claim to list every dataset is
    inaccurate for two files.
  evidence: |
    Loaded by 7c_penguins.qmd, 7c_penguins-key.qmd, 7d_project_kickoff.qmd,
    cheatsheets/seaborn.qmd and cheatsheets/chart_customization.qmd.
  action: Add both files to data_urls.py and add penguins.csv to the IN_REPO set.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py t5_dataset_catalog
    expect: every file in data/ that a live page loads appears in data_urls.py

- id: T7
  title: Make every make target run inside the course environment
  category: tooling
  severity: high
  owner: claude
  state: open
  why: |
    The Makefile called bare python, so a target inherited whatever environment
    the shell happened to be in. Run outside eds217_2026, `make cells` reported
    108 failing cells across seven pages, all of them tracing back to a single
    missing seaborn. That reads as a large content defect and it is nothing of
    the kind: the full quarto render passed every one of those pages, because
    build_docs.py activates the environment itself. A checker that turns a shell
    problem into an apparent content problem costs more than it saves.
  evidence: |
    make cells on 2026-08-23 reported ModuleNotFoundError for seaborn in
    7c_penguins-key, eod-day7-2026-key, chart_customization, seaborn.qmd,
    7c_penguins, eod-day7-2026 and 7b_seaborn, then 108 consequent NameErrors.
    environment-2026.yml pins seaborn>=0.13, and the render of all seven pages
    succeeded the same day.
  action: |
    Add tools/run.sh, which sources tools/_env.sh, activates the environment and
    execs the command, and route every python recipe in the Makefile through it.
    Separately, give run_cells.py a preflight that names the missing package, the
    interpreter and the active environment, then exits 2 rather than executing
    cells it cannot possibly pass.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py t7_make_targets_use_the_env
    expect: tools/run.sh exists and no recipe line calls python outside it

- id: T6
  title: Scope the cell checker to the pages the site actually renders
  category: tooling
  severity: high
  owner: claude
  state: open
  why: |
    Running run_cells.py over everything under course-materials reports fifteen
    failures, and every one is in a page that is excluded from the render:
    2a_getting_help.qmd, and lectures/pandas_workflow.qmd and lectures/seaborn.qmd.
    Two of those need the network, since seaborn.load_dataset downloads. A red
    result that is entirely pages nobody sees is a checker you stop reading, so
    the checker should walk the render set rather than the directory.
  evidence: |
    960 of 975 cells clean across 96 files. Restricted to the 89-file render set,
    every cell passes.
  action: |
    Add a --render-set listing to prelaunch_checks.py, and point the cells target
    in the Makefile and in render-check.sh at it. Keep t6_cells_clean as the
    standing gate, so a broken cell on a live page is caught before a render.
  verify:
    kind: command
    cmd: python3 tools/prelaunch_checks.py t6_cells_clean
    expect: every cell on every rendered page runs clean

